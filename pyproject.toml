[project]
name = "nlp-jepa"
version = "0.1.0"
description = "JEPA language model: encoder, latent predictor, and decoder"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.13",
  "transformers",
  "datasets",
  "pyarrow",
  "tokenizers",
  "tqdm",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
